name: Build Hydrocarbon_Generator

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-cursor0 libegl1 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install rdkit networkx numpy matplotlib cairosvg pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller Hydrocarbon_Generator_linux.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydrocarbon_Generator-linux
          path: dist/Hydrocarbon_Generator/
